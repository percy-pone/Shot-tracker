<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shot Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14161b">
<title>Basketball Shot Tracker</title>
<style>
  :root {
    --bg: #14161b;
    --card: #1e2128;
    --card-2: #262a33;
    --text: #f2f3f5;
    --muted: #9aa1ad;
    --orange: #f58220;
    --green: #2fbf71;
    --red: #e5484d;
    --border: #2f343e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 16px;
    padding-top: max(16px, env(safe-area-inset-top));
    padding-bottom: max(16px, env(safe-area-inset-bottom));
    min-height: 100vh;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  header {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 12px; margin-bottom: 16px;
  }
  h1 { font-size: 1.5rem; margin: 0; }
  h1 span { color: var(--orange); }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    font: inherit; cursor: pointer; border: 1px solid var(--border);
    background: var(--card-2); color: var(--text);
    padding: 8px 14px; border-radius: 8px; transition: transform .05s, background .15s;
  }
  button:hover { background: #313642; }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .4; cursor: default; }
  .btn-primary { background: var(--orange); border-color: var(--orange); color: #111; font-weight: 600; }
  .btn-primary:hover { background: #ff9440; }
  .btn-danger { color: var(--red); }

  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 16px; margin-bottom: 16px;
  }
  .card h2 { font-size: 1rem; margin: 0 0 12px; color: var(--muted); font-weight: 600;
    text-transform: uppercase; letter-spacing: .05em; }

  /* Player selector */
  .players { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .player {
    border: 2px solid var(--border); border-radius: 12px; padding: 12px;
    background: var(--card-2); cursor: pointer; text-align: left; color: var(--text);
  }
  .player.active { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(245,130,32,.15); }
  .player input {
    background: transparent; border: none; border-bottom: 1px dashed var(--muted);
    color: var(--text); font: inherit; font-weight: 600; font-size: 1rem;
    width: 100%; padding: 2px 0; outline: none;
  }
  .player input::placeholder { color: var(--muted); font-weight: 400; }
  .player .mini { font-size: .85rem; color: var(--muted); margin-top: 6px; }
  .player .pts { font-size: 1.6rem; font-weight: 700; margin-top: 4px; }

  /* Shot buttons */
  .shots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .shot {
    border-radius: 12px; padding: 14px; background: var(--card-2);
    border: 1px solid var(--border);
  }
  .shot-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .shot-name { font-weight: 600; font-size: 1.05rem; }
  .shot-pts { font-size: .8rem; color: var(--muted); }
  .shot-stat { font-size: .9rem; color: var(--muted); margin-bottom: 10px; }
  .shot-stat strong { color: var(--text); }
  .shot-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .make { background: rgba(47,191,113,.15); border-color: rgba(47,191,113,.5); color: var(--green); font-weight: 700; font-size: 1rem; padding: 14px; }
  .make:hover { background: rgba(47,191,113,.25); }
  .miss { background: rgba(229,72,77,.12); border-color: rgba(229,72,77,.45); color: var(--red); font-weight: 700; font-size: 1rem; padding: 14px; }
  .miss:hover { background: rgba(229,72,77,.22); }

  /* Stats table */
  table { width: 100%; border-collapse: collapse; font-size: .95rem; }
  th, td { padding: 10px 6px; text-align: right; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; }
  th:first-child, td:first-child { text-align: left; }
  tr.current td { color: var(--orange); }
  .bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin-top: 4px; min-width: 60px; }
  .bar > div { height: 100%; background: var(--orange); }

  .empty { color: var(--muted); text-align: center; padding: 20px; }
  .log { max-height: 220px; overflow-y: auto; font-size: .9rem; }
  .log div { padding: 6px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 8px; }
  .tag-make { color: var(--green); font-weight: 600; }
  .tag-miss { color: var(--red); font-weight: 600; }
  .muted { color: var(--muted); }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--card-2); border: 1px solid var(--border); padding: 10px 16px;
    border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; font-size: .9rem;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 600px) {
    .players { grid-template-columns: 1fr; }
    .shots { grid-template-columns: 1fr; }
    th, td { padding: 8px 4px; font-size: .85rem; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🏀 Shot <span>Tracker</span></h1>
    <div class="toolbar">
      <button id="undoBtn">↶ Undo</button>
      <button id="copyBtn">Copy summary</button>
      <button id="resetBtn" class="btn-danger">Reset all</button>
    </div>
  </header>

  <div class="card">
    <h2>Select shooter</h2>
    <div class="players" id="players"></div>
  </div>

  <div class="card">
    <h2 id="currentLabel">Log shots</h2>
    <div class="shots" id="shots"></div>
  </div>

  <div class="card">
    <h2>Scoreboard</h2>
    <div id="stats"></div>
  </div>

  <div class="card">
    <h2>Recent shots</h2>
    <div class="log" id="log"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
  const STORAGE_KEY = "shotTracker.v1";
  const SHOT_TYPES = [
    { id: "mid",   name: "Mid-range",    points: 2 },
    { id: "three", name: "3-Pointer",    points: 3 },
    { id: "ft",    name: "Free Throw",   points: 1 },
  ];

  const defaultState = () => ({
    players: [
      { name: "Boy 1", shots: [] },
      { name: "Boy 2", shots: [] },
      { name: "Boy 3", shots: [] },
    ],
    activePlayer: 0,
    history: [],   // [{playerIndex, shot, made, ts}] for undo
  });

  let state = load();

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const s = JSON.parse(raw);
        if (s && Array.isArray(s.players)) return { ...defaultState(), ...s };
      }
    } catch (e) { /* storage unavailable: fall through */ }
    return defaultState();
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function toast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove("show"), 1400);
  }

  function pct(made, att) { return att === 0 ? "—" : Math.round((made / att) * 100) + "%"; }
  function pctNum(made, att) { return att === 0 ? 0 : Math.round((made / att) * 100); }

  function statsFor(player) {
    const out = {};
    let fgMade = 0, fgAtt = 0, points = 0;
    for (const st of SHOT_TYPES) {
      const shots = player.shots.filter(s => s.shot === st.id);
      const made = shots.filter(s => s.made).length;
      out[st.id] = { made, att: shots.length };
      if (st.id !== "ft") { fgMade += made; fgAtt += shots.length; }
      points += made * st.points;
    }
    return { byShot: out, made: fgMade, att: fgAtt, points, three: { made: out.three.made, att: out.three.att } };
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function renderPlayers() {
    const el = document.getElementById("players");
    el.innerHTML = "";
    state.players.forEach((p, i) => {
      const s = statsFor(p);
      const card = document.createElement("div");
      card.className = "player" + (i === state.activePlayer ? " active" : "");
      card.innerHTML = `
        <input value="${esc(p.name)}" placeholder="Type name" maxlength="20" aria-label="Player ${i+1} name">
        <div class="mini">${s.made}/${s.att} made · ${pct(s.made, s.att)}</div>
        <div class="pts">${s.points} pts</div>`;
      card.addEventListener("click", () => { state.activePlayer = i; save(); render(); });
      card.querySelector("input").addEventListener("input", (e) => {
        p.name = e.target.value || `Player ${i+1}`;
        save();
        renderStats(); renderLog();
      });
      el.appendChild(card);
    });
  }

  function renderShots() {
    const p = state.players[state.activePlayer];
    document.getElementById("currentLabel").textContent = `Log shots — ${p.name}`;
    const s = statsFor(p);
    const el = document.getElementById("shots");
    el.innerHTML = "";
    for (const st of SHOT_TYPES) {
      const b = s.byShot[st.id];
      const box = document.createElement("div");
      box.className = "shot";
      box.innerHTML = `
        <div class="shot-head">
          <span class="shot-name">${st.name}</span>
          <span class="shot-pts">${st.points} pt${st.points > 1 ? "s" : ""}</span>
        </div>
        <div class="shot-stat"><strong>${b.made}</strong> of ${b.att} · ${pct(b.made, b.att)}</div>
        <div class="shot-actions">
          <button class="make" data-shot="${st.id}" data-made="1">✓ Make</button>
          <button class="miss" data-shot="${st.id}" data-made="0">✗ Miss</button>
        </div>`;
      el.appendChild(box);
    }
    el.querySelectorAll("button[data-shot]").forEach(btn => {
      btn.addEventListener("click", () => recordShot(btn.dataset.shot, btn.dataset.made === "1"));
    });
  }

  function recordShot(shotId, made) {
    const p = state.players[state.activePlayer];
    const entry = { shot: shotId, made, ts: Date.now() };
    p.shots.push(entry);
    state.history.push({ playerIndex: state.activePlayer, ...entry });
    save();
    render();
    const st = SHOT_TYPES.find(x => x.id === shotId);
    toast(`${p.name}: ${made ? "Made" : "Missed"} ${st.name}`);
  }

  function undo() {
    const last = state.history.pop();
    if (!last) { toast("Nothing to undo"); return; }
    const p = state.players[last.playerIndex];
    if (p) {
      const idx = p.shots.map(s => s.ts).lastIndexOf(last.ts);
      if (idx > -1) p.shots.splice(idx, 1);
    }
    save();
    render();
    toast("Last shot removed");
  }

  function renderStats() {
    const rows = state.players.map((p, i) => ({ p, i, s: statsFor(p) }));
    const sorted = [...rows].sort((a, b) => b.s.points - a.s.points || pctNum(b.s.made, b.s.att) - pctNum(a.s.made, a.s.att));
    const anyShots = rows.some(r => r.s.byShot.mid.att + r.s.byShot.three.att + r.s.byShot.ft.att > 0);
    if (!anyShots) {
      document.getElementById("stats").innerHTML = `<div class="empty">No shots yet. Pick a shooter and start logging!</div>`;
      return;
    }
    const head = `<tr>
      <th>Player</th><th>FG</th><th>FG%</th><th>3PT</th><th>FT</th><th>PTS</th></tr>`;
    const body = sorted.map(({ p, i, s }) => `
      <tr class="${i === state.activePlayer ? "current" : ""}">
        <td>${esc(p.name)}</td>
        <td>${s.made}/${s.att}</td>
        <td>
          ${pct(s.made, s.att)}
          <div class="bar"><div style="width:${pctNum(s.made, s.att)}%"></div></div>
        </td>
        <td>${s.three.made}/${s.three.att}</td>
        <td>${s.byShot.ft.made}/${s.byShot.ft.att}</td>
        <td><strong>${s.points}</strong></td>
      </tr>`).join("");
    document.getElementById("stats").innerHTML = `<table><thead>${head}</thead><tbody>${body}</tbody></table>`;
  }

  function renderLog() {
    const el = document.getElementById("log");
    const all = [];
    state.players.forEach((p) => p.shots.forEach(s => all.push({ name: p.name, ...s })));
    all.sort((a, b) => b.ts - a.ts);
    if (!all.length) { el.innerHTML = `<div class="empty">Shots you log will appear here.</div>`; return; }
    el.innerHTML = all.slice(0, 40).map(s => {
      const st = SHOT_TYPES.find(x => x.id === s.shot);
      const time = new Date(s.ts).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
      return `<div>
        <span><strong>${esc(s.name)}</strong> · ${st.name}</span>
        <span><span class="${s.made ? "tag-make" : "tag-miss"}">${s.made ? "MADE" : "MISS"}</span>
        <span class="muted"> ${time}</span></span>
      </div>`;
    }).join("");
  }

  function summaryText() {
    const lines = ["Shot Tracker Summary", ""];
    state.players.forEach(p => {
      const s = statsFor(p);
      lines.push(`${p.name}: ${s.made}/${s.att} FG (${pct(s.made, s.att)}), 3PT ${s.three.made}/${s.three.att}, FT ${s.byShot.ft.made}/${s.byShot.ft.att}, ${s.points} pts`);
    });
    return lines.join("\n");
  }

  function render() {
    renderPlayers();
    renderShots();
    renderStats();
    renderLog();
  }

  document.getElementById("undoBtn").addEventListener("click", undo);
  document.getElementById("copyBtn").addEventListener("click", async () => {
    const text = summaryText();
    try {
      await navigator.clipboard.writeText(text);
      toast("Summary copied");
    } catch (e) {
      toast("Copy not available here");
    }
  });
  document.getElementById("resetBtn").addEventListener("click", () => {
    if (!confirm("Reset all shots?")) return;
    const names = state.players.map(p => p.name);
    state = defaultState();
    state.players.forEach((p, i) => p.name = names[i]);
    save(); render(); toast("Reset");
  });

  // Keyboard shortcuts: 1-3 pick shooter, U = undo
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT") return;
    if (["1","2","3"].includes(e.key)) { state.activePlayer = Number(e.key) - 1; save(); render(); }
    if (e.key === "u" || e.key === "U") undo();
  });

  render();
</script>
</body>
</html>
