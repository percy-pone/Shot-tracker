<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hoops Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#10203a">
<title>Basketball Shot Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #10203a;        /* gym at night */
    --paint: #1a3054;      /* the key */
    --paint-2: #24406d;
    --line: #f6f3ea;       /* court lines */
    --chalk: #a9b9d4;
    --ball: #f26b1d;
    --make: #3ddc97;
    --miss: #ff7b7b;
    --rule: #2f4b7a;
    --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", sans-serif;
    --body: "Barlow", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html { background: var(--ink); }
  body {
    margin: 0; font-family: var(--body); font-size: 16px; line-height: 1.4;
    background: var(--ink); color: var(--line);
    padding: 14px 16px 104px;
    padding-top: max(14px, env(safe-area-inset-top));
    min-height: 100vh; -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  button, select, input, textarea { font: inherit; color: var(--line); }
  button { cursor: pointer; border: 1px solid var(--rule); background: var(--paint-2); padding: 10px 14px; border-radius: 10px; touch-action: manipulation; font-weight: 600; }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .35; cursor: default; }
  :focus-visible { outline: 2px solid var(--line); outline-offset: 2px; }
  .primary { background: var(--ball); border-color: var(--ball); color: #1a0d03; }
  .quiet { background: transparent; color: var(--chalk); }
  .danger { color: var(--miss); background: transparent; }
  .num { font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: .01em; }

  /* top bar */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .top h1 { font-family: var(--display); font-weight: 700; font-size: 1.9rem; line-height: 1; margin: 0; letter-spacing: .01em; }
  .top p { margin: 2px 0 0; color: var(--chalk); font-size: .9rem; }
  .daynav { display: flex; gap: 6px; }
  .daynav button { width: 44px; height: 44px; padding: 0; font-size: 1.3rem; }

  /* jersey tabs */
  .jerseys { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 14px; padding: 2px 16px 6px; scrollbar-width: none; }
  .jerseys::-webkit-scrollbar { display: none; }
  .jersey { flex: 0 0 auto; min-width: 92px; text-align: left; padding: 8px 12px 9px; border-radius: 12px; background: var(--paint); border: 2px solid transparent; }
  .jersey b { display: block; font-family: var(--display); font-weight: 700; font-size: 1.35rem; line-height: 1.1; white-space: nowrap; }
  .jersey span { font-size: .8rem; color: var(--chalk); font-weight: 500; }
  .jersey.on { border-color: var(--ball); background: var(--paint-2); }
  .jersey.edit { min-width: 0; border: 2px dashed var(--rule); background: transparent; color: var(--chalk); display: flex; align-items: center; font-size: .9rem; }

  h2 { font-family: var(--display); font-weight: 700; font-size: 1.45rem; margin: 22px 0 8px; letter-spacing: .01em; }
  h2:first-child { margin-top: 0; }
  .hint { color: var(--chalk); font-size: .9rem; margin: -4px 0 12px; }

  /* training plan rows */
  .panel { background: var(--paint); border-radius: 16px; padding: 4px 14px; }
  .drill { padding: 14px 0; border-bottom: 1px solid var(--rule); }
  .drill:last-child { border-bottom: none; }
  .drill-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .drill-name { font-weight: 600; font-size: 1.05rem; }
  .drill-name small { display: block; font-weight: 400; color: var(--chalk); font-size: .82rem; }
  .drill-val { display: flex; align-items: baseline; gap: 6px; color: var(--chalk); font-size: .9rem; white-space: nowrap; }
  .drill-val input, .stepper input { width: 64px; text-align: right; background: var(--ink); border: 1px solid var(--rule); border-radius: 8px; padding: 4px 8px; font-family: var(--display); font-weight: 700; font-size: 1.5rem; line-height: 1.1; }
  .bar { height: 8px; background: var(--ink); border-radius: 4px; overflow: hidden; margin: 10px 0; }
  .bar i { display: block; height: 100%; background: var(--ball); border-radius: 4px; transition: width .25s ease; }
  .done .bar i { background: var(--make); }
  .week { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; font-size: .85rem; color: var(--chalk); }
  .dots { display: flex; gap: 4px; }
  .dot { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--rule); display: grid; place-items: center; font-size: .68rem; font-weight: 600; color: var(--chalk); }
  .dot.part { border-color: var(--ball); color: var(--line); }
  .dot.hit { background: var(--ball); border-color: var(--ball); color: #1a0d03; }
  .dot.future { opacity: .45; }
  .dot.today { box-shadow: 0 0 0 2px var(--paint), 0 0 0 3.5px var(--line); }
  .week .ok { color: var(--make); font-weight: 600; }
  .quick { display: flex; gap: 8px; margin-top: 10px; }
  .quick button { flex: 1; padding: 11px 4px; }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .stepper button { width: 44px; height: 44px; padding: 0; font-size: 1.3rem; }
  .stepper input { width: 62px; text-align: center; padding: 6px 4px; }
  .badge { display: inline-block; margin-top: 8px; background: var(--make); color: #05301e; font-weight: 600; font-size: .8rem; padding: 3px 10px; border-radius: 999px; }
  .tick { color: var(--make); font-weight: 600; }

  /* shooting */
  .shot { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--rule); }
  .shot:last-child { border-bottom: none; }
  .shot-name { font-weight: 600; font-size: 1.05rem; }
  .shot-stat { color: var(--chalk); font-size: .9rem; }
  .shot-stat .num { color: var(--line); font-size: 1.5rem; margin-right: 6px; }
  .shot-btns { display: flex; gap: 8px; grid-row: span 2; }
  .shot-btns button { width: 78px; height: 58px; font-size: 1rem; }
  .mk { background: rgba(61,220,151,.16); border-color: var(--make); color: var(--make); }
  .ms { background: rgba(255,123,123,.12); border-color: var(--miss); color: var(--miss); }
  .fix { grid-column: 1 / -1; font-size: .82rem; color: var(--chalk); }
  .fix button { font-size: .82rem; padding: 4px 10px; margin-left: 4px; font-weight: 500; }

  table { width: 100%; border-collapse: collapse; font-size: .92rem; }
  .scroll { overflow-x: auto; }
  th, td { padding: 9px 6px; text-align: right; border-bottom: 1px solid var(--rule); white-space: nowrap; font-variant-numeric: tabular-nums; }
  th { color: var(--chalk); font-weight: 500; font-size: .8rem; }
  th:first-child, td:first-child { text-align: left; font-weight: 600; }
  tr:last-child td { border-bottom: none; }

  /* progress */
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  select { background: var(--paint-2); border: 1px solid var(--rule); border-radius: 10px; padding: 10px; flex: 1; min-width: 150px; font-weight: 600; }
  .seg { display: flex; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
  .seg button { border: none; border-radius: 0; background: var(--paint-2); color: var(--chalk); padding: 10px 12px; }
  .seg button.on { background: var(--line); color: var(--ink); }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--rule); border-radius: 12px; overflow: hidden; margin-bottom: 14px; }
  .tile { background: var(--paint); padding: 10px 12px; }
  .tile .k { font-size: .8rem; color: var(--chalk); }
  .tile .v { font-family: var(--display); font-weight: 700; font-size: 2rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .tile .s { font-size: .8rem; color: var(--chalk); }
  .up { color: var(--make); } .down { color: var(--miss); }
  .chart { position: relative; }
  .chart svg { display: block; width: 100%; touch-action: pan-y; }
  .chart text { fill: var(--chalk); font-size: 11px; font-family: var(--body); }
  .tip { position: absolute; top: 0; transform: translateX(-50%); background: var(--ink); border: 1px solid var(--rule); border-radius: 8px; padding: 6px 10px; font-size: .8rem; white-space: nowrap; pointer-events: none; display: none; color: var(--chalk); }
  .tip strong { display: block; font-size: .95rem; color: var(--line); }
  details { margin: 6px 0 10px; }
  summary { color: var(--chalk); font-size: .88rem; cursor: pointer; padding: 6px 0; }
  .wkrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .wkrow:last-child { border-bottom: none; }
  .wkrow .n { font-weight: 600; white-space: nowrap; font-size: .95rem; }
  .wkrow .dot, .week .dot { width: 22px; height: 22px; }
  .wkrow .dots, .week .dots { gap: 3px; }
  .week > span { white-space: nowrap; }
  .wkrow .c { font-size: .85rem; color: var(--chalk); text-align: right; min-width: 46px; white-space: nowrap; }

  /* goals + players */
  .goal { padding: 14px 0; border-bottom: 1px solid var(--rule); }
  .goal:last-child { border-bottom: none; }
  .goal-line { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; color: var(--chalk); font-size: .92rem; }
  .field { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .field input[type=text] { flex: 1; min-width: 0; background: var(--ink); border: 1.5px solid var(--rule); border-radius: 10px; padding: 12px; font-size: 1.1rem; font-weight: 600; }
  .field input[type=text]:focus { border-color: var(--ball); outline: none; }
  .stack { display: grid; gap: 8px; margin-top: 12px; }
  textarea { width: 100%; min-height: 76px; background: var(--ink); border: 1px solid var(--rule); border-radius: 10px; padding: 10px; font-size: .85rem; }
  .empty { color: var(--chalk); padding: 18px 0; }

  /* welcome */
  .welcome { padding-top: 8vh; }
  .welcome h1 { font-family: var(--display); font-weight: 700; font-size: 3.2rem; line-height: .95; margin: 0 0 10px; }
  .welcome p { color: var(--chalk); margin: 0 0 20px; max-width: 34ch; }
  .welcome .primary { width: 100%; padding: 15px; font-size: 1.05rem; margin-top: 8px; }

  /* bottom nav */
  .nav { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(16,32,58,.96); border-top: 1px solid var(--rule); display: none; justify-content: center; padding-bottom: env(safe-area-inset-bottom); z-index: 4; }
  .nav.show { display: flex; }
  .nav button { flex: 1; max-width: 160px; border: none; background: transparent; border-radius: 0; color: var(--chalk); padding: 10px 2px 12px; font-size: .78rem; font-weight: 600; display: grid; justify-items: center; gap: 3px; }
  .nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .nav button.on { color: var(--ball); }
  .undo { position: fixed; right: 16px; bottom: calc(84px + env(safe-area-inset-bottom)); z-index: 3; background: var(--ink); border-color: var(--rule); border-radius: 999px; padding: 9px 16px; display: none; }
  .undo.show { display: block; }

  .toast { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); background: var(--line); color: var(--ink); font-weight: 600; padding: 10px 16px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; font-size: .92rem; z-index: 6; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; }
  .modal { position: fixed; inset: 0; background: rgba(5,12,24,.7); display: none; align-items: center; justify-content: center; padding: 20px; z-index: 10; }
  .modal.show { display: flex; }
  .modal .box { background: var(--paint); border: 1px solid var(--rule); border-radius: 16px; padding: 18px; max-width: 340px; width: 100%; }
  .modal p { margin: 0 0 16px; }
  .modal .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } button:active { transform: none; } }
</style>
</head>
<body>
<div class="wrap"><main id="app"></main></div>
<button class="undo" id="undoBtn">Undo</button>
<nav class="nav" id="nav" aria-label="Sections"></nav>
<div class="toast" id="toast" role="status"></div>
<div class="modal" id="modal"><div class="box">
  <p id="modalMsg"></p>
  <div class="two"><button id="modalNo">Cancel</button><button id="modalYes" class="danger">Yes</button></div>
</div></div>

<script>
(function () {
  "use strict";
  var KEY = "hoopsTracker.v3", V2 = "hoopsTracker.v2", MAX_PLAYERS = 10;

  var SHOTS = [
    { id: "mid",   name: "Mid-range",  points: 2 },
    { id: "three", name: "3-pointer",  points: 3 },
    { id: "ft",    name: "Free throw", points: 1 }
  ];
  var DRILLS = [
    { id: "ball",    name: "Ball handling", short: "Ball",  unit: "min",  mode: "total", def: { target: 30, days: 5 }, steps: [5, 10], gstep: 5 },
    { id: "rope",    name: "Jump rope",     short: "Rope",  unit: "min",  mode: "total", def: { target: 10, days: 5 }, steps: [1, 5],  gstep: 1 },
    { id: "squats",  name: "Squats",        short: "Squat", unit: "reps", mode: "total", def: { target: 60, days: 4 }, steps: [10, 20], gstep: 5 },
    { id: "pushups", name: "Push-ups",      short: "Push",  unit: "reps", mode: "max",   def: { target: 0,  days: 5 }, gstep: 1 },
    { id: "pullups", name: "Pull-ups",      short: "Pull",  unit: "reps", mode: "max",   def: { target: 0,  days: 5 }, gstep: 1 }
  ];
  function drillById(id) { return DRILLS.find(function (d) { return d.id === id; }); }
  var METRICS = DRILLS.map(function (d) {
    return { id: d.id, label: d.mode === "max" ? "Max " + d.name.toLowerCase() : d.name, kind: d.mode === "max" ? "max" : "count", unit: d.unit, drill: d.id };
  }).concat([
    { id: "fg",    label: "Field goal %",  kind: "pct", shots: ["mid", "three"] },
    { id: "mid",   label: "Mid-range %",   kind: "pct", shots: ["mid"] },
    { id: "three", label: "3-pointer %",   kind: "pct", shots: ["three"] },
    { id: "ft",    label: "Free throw %",  kind: "pct", shots: ["ft"] },
    { id: "made",  label: "Shots made",    kind: "count", unit: "made" }
  ]);
  var RANGES = [{ id: "7", label: "7D", n: 7 }, { id: "30", label: "30D", n: 30 }, { id: "90", label: "90D", n: 90 }, { id: "all", label: "All", n: 0 }];
  var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  var DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], DLET = ["M","T","W","T","F","S","S"];

  /* ---------- dates ---------- */
  function keyOf(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function fromKey(k) { var p = k.split("-"); return new Date(+p[0], +p[1] - 1, +p[2], 12); }
  function addDays(d, n) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12); x.setDate(x.getDate() + n); return x; }
  function today() { var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate(), 12); }
  function md(d) { return MONTHS[d.getMonth()] + " " + d.getDate(); }
  function daysBetween(a, b) { return Math.round((b - a) / 864e5); }
  function weekStart(d) { return addDays(d, -((d.getDay() + 6) % 7)); }

  /* ---------- state ---------- */
  function newId() { return "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function blank() {
    return { players: [1, 2, 3].map(function (n) { return { id: "p" + n, name: "" }; }),
             days: {}, goals: {}, setup: false, ui: { tab: "today", active: "p1", metric: "ball", range: "30" } };
  }
  function valid(s) { return s && Array.isArray(s.players) && s.days && typeof s.days === "object"; }
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var s = JSON.parse(raw); if (valid(s)) { s.ui = Object.assign(blank().ui, s.ui || {}); s.goals = s.goals || {}; return s; } }
      var old = localStorage.getItem(V2);
      if (old) {
        var o = JSON.parse(old);
        if (valid(o)) {
          var n = blank(); n.players = o.players; n.days = o.days;
          Object.keys(n.days).forEach(function (k) { Object.keys(n.days[k]).forEach(function (p) { if (n.days[k][p].d) n.days[k][p].d.rope = 0; }); });
          n.setup = !o.players.every(function (p) { return /^Boy \d+$/.test(p.name); });
          if (!n.setup) n.players.forEach(function (p) { p.name = ""; });
          return n;
        }
      }
    } catch (e) {}
    return blank();
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  function emptyEntry() { return { s: { mid: [0, 0], three: [0, 0], ft: [0, 0] }, d: { ball: 0, rope: 0, squats: 0, pushups: 0, pullups: 0 } }; }
  function entry(dateKey, pid, create) {
    var day = state.days[dateKey];
    if (!day) { if (!create) return null; day = state.days[dateKey] = {}; }
    var e = day[pid];
    if (!e) { if (!create) return null; e = day[pid] = emptyEntry(); }
    var base = emptyEntry();
    e.s = Object.assign(base.s, e.s || {}); e.d = Object.assign(base.d, e.d || {});
    return e;
  }
  function isActive(e) {
    if (!e) return false;
    return SHOTS.some(function (t) { return e.s[t.id][1] > 0; }) || DRILLS.some(function (d) { return e.d[d.id] > 0; });
  }
  function val(pid, dateKey, drillId) { var e = entry(dateKey, pid, false); return e ? e.d[drillId] || 0 : 0; }
  function goal(pid, drillId) { var g = state.goals[pid] && state.goals[pid][drillId]; return g || drillById(drillId).def; }
  function isHit(v, g, d) { return d.mode === "max" ? v > 0 && v >= g.target : (g.target > 0 ? v >= g.target : v > 0); }
  function weekInfo(pid, d, ref) {
    var start = weekStart(ref), t = today(), g = goal(pid, d.id), out = { days: [], hits: 0 };
    for (var i = 0; i < 7; i++) {
      var day = addDays(start, i), st;
      if (day > t) st = "future";
      else { var v = val(pid, keyOf(day), d.id); st = isHit(v, g, d) ? "hit" : v > 0 ? "part" : "none"; if (st === "hit") out.hits++; }
      out.days.push({ st: st, today: keyOf(day) === keyOf(ref) });
    }
    return out;
  }
  function dayScore(pid, dateKey) {
    var hit = 0, total = 0;
    DRILLS.forEach(function (d) { var g = goal(pid, d.id); if (g.days > 0) { total++; if (isHit(val(pid, dateKey, d.id), g, d)) hit++; } });
    return { hit: hit, total: total };
  }
  function best(pid, drillId, exceptKey) {
    var b = { v: 0, date: null };
    Object.keys(state.days).forEach(function (k) { if (k === exceptKey) return; var v = val(pid, k, drillId); if (v > b.v) b = { v: v, date: fromKey(k) }; });
    return b;
  }

  var state = load();
  var viewDate = today();
  var undoStack = [];
  if (!state.players.some(function (p) { return p.id === state.ui.active; })) state.ui.active = state.players[0] ? state.players[0].id : null;

  /* ---------- helpers ---------- */
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function pct(m, a) { return a ? Math.round(m / a * 100) + "%" : "–"; }
  function player() { return state.players.find(function (p) { return p.id === state.ui.active; }) || null; }
  function toast(msg) { var t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove("show"); }, 1800); }
  var modalCb = null;
  function ask(msg, yes, cb) { $("modalMsg").textContent = msg; $("modalYes").textContent = yes; modalCb = cb; $("modal").classList.add("show"); }
  $("modalNo").onclick = function () { $("modal").classList.remove("show"); modalCb = null; };
  $("modalYes").onclick = function () { $("modal").classList.remove("show"); var cb = modalCb; modalCb = null; if (cb) cb(); };

  function mutate(dateKey, pid, fn) {
    var before = entry(dateKey, pid, false);
    undoStack.push({ date: dateKey, pid: pid, prev: before ? JSON.parse(JSON.stringify(before)) : null });
    if (undoStack.length > 200) undoStack.shift();
    fn(entry(dateKey, pid, true));
    save(); render();
  }
  function setDrill(p, d, newVal) {
    var k = keyOf(viewDate), g = goal(p.id, d.id), old = val(p.id, k, d.id);
    var prevBest = best(p.id, d.id, k).v;
    newVal = Math.max(0, Math.min(9999, Math.round(newVal)));
    if (newVal === old) return;
    mutate(k, p.id, function (e) { e.d[d.id] = newVal; });
    if (d.mode === "max" && newVal > prevBest && prevBest > 0 && old <= prevBest) toast("New personal best for " + p.name + ": " + newVal + " " + d.name.toLowerCase());
    else if (g.days > 0 && !isHit(old, g, d) && isHit(newVal, g, d)) {

      function stepper(field, v, label, step) {
        return '<div class="goal-line"><span>' + label + '</span><div class="stepper">' +
          '<button data-act="goal" data-drill="' + d.id + '" data-field="' + field + '" data-n="' + (-step) + '" aria-label="Lower ' + label + '"' + (v <= 0 ? " disabled" : "") + ">−</button>" +
          '<input type="number" inputmode="numeric" min="0" value="' + v + '" data-goal="' + d.id + '" data-field="' + field + '" aria-label="' + d.name + ", " + label + '">' +
          '<button data-act="goal" data-drill="' + d.id + '" data-field="' + field + '" data-n="' + step + '" aria-label="Raise ' + label + '">+</button></div></div>';
      }
      h += '<div class="goal"><div class="drill-name">' + (d.mode === "max" ? "Max " + d.name.toLowerCase() : d.name) +
        "<small>" + (d.mode === "max" ? (g.target ? "One set of at least " + g.target + " counts as a goal day" : "Any all-out set counts as a goal day. Set reps to reach if you want a minimum.") : g.target + " " + d.unit + " counts as a goal day") + "</small></div>" +
        stepper("target", g.target, d.mode === "max" ? "Reps to reach" : (d.unit === "min" ? "Minutes a day" : "Reps a day"), d.gstep) +
        stepper("days", g.days, "Days a week", 1) + "</div>";
    });
    h += '</div><div class="stack">' +
      (state.players.length > 1 ? '<button data-act="copyGoals">Use ' + esc(p.name) + "'s goals for everyone</button>" : "") +
      '<button class="quiet" data-act="resetGoals">Reset ' + esc(p.name) + " to the starting goals</button></div>";
    return h;
  }

  /* ---------- players ---------- */
  function viewPlayers() {
    var h = '<div class="top"><div><h1>Players</h1><p>Tap a name to change it. It saves as you type.</p></div></div>';
    state.players.forEach(function (p, i) {
      h += '<div class="field"><input type="text" maxlength="16" value="' + esc(p.name) + '" data-name="' + p.id + '" aria-label="Player ' + (i + 1) + ' name" placeholder="Name" autocomplete="off">' +
        '<button class="danger" data-act="del" data-id="' + p.id + '">Remove</button></div>';
    });
    h += '<h2>Add a player</h2><div class="field"><input type="text" id="newName" maxlength="16" placeholder="Name" aria-label="New player name" autocomplete="off">' +
      '<button class="primary" data-act="addPlayer"' + (state.players.length >= MAX_PLAYERS ? " disabled" : "") + ">Add player</button></div>";
    h += '<h2>Backup</h2><p class="hint">Everything is saved on this phone only. Copy a backup now and then. To move to another phone, paste it there and restore.</p>' +
      '<div class="stack"><button data-act="backup">Copy backup</button>' +
      '<textarea id="restoreText" placeholder="Paste a backup here" aria-label="Backup text"></textarea>' +
      '<button data-act="restore">Restore backup</button>' +
      '<button class="danger" data-act="wipe">Erase all logs</button></div>';
    return h;
  }

  var ICONS = {
    today: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16 9.5"/></svg>',
    progress: '<svg viewBox="0 0 24 24"><path d="M4 19h16"/><path d="M5 15l4-5 4 3 6-8"/></svg>',
    goals: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>',
    players: '<svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2c2.8 0 5 2.2 5 5"/></svg>'
  };
  function render() {
    var y = window.scrollY;
    if (!state.setup) { $("nav").classList.remove("show"); $("undoBtn").classList.remove("show"); $("app").innerHTML = viewWelcome(); return; }
    var tabs = [["today", "Today"], ["progress", "Progress"], ["goals", "Goals"], ["players", "Players"]];
    $("nav").classList.add("show");
    $("nav").innerHTML = tabs.map(function (t) { return '<button data-tab="' + t[0] + '"' + (state.ui.tab === t[0] ? ' class="on" aria-current="page"' : "") + ">" + ICONS[t[0]] + t[1] + "</button>"; }).join("");
    var v = state.ui.tab;
    $("app").innerHTML = v === "progress" ? viewProgress() : v === "goals" ? viewGoals() : v === "players" ? viewPlayers() : viewToday();
    $("undoBtn").classList.toggle("show", v === "today" && undoStack.length > 0);
    if (v === "progress") drawChart();
    window.scrollTo(0, y);
  }
  function go(tab) { state.ui.tab = tab; save(); render(); window.scrollTo(0, 0); }

  /* ---------- events ---------- */
  $("nav").addEventListener("click", function (ev) { var b = ev.target.closest("button[data-tab]"); if (b) go(b.dataset.tab); });
  $("undoBtn").addEventListener("click", undo);

  function setGoal(pid, drillId, field, v) {
    var g = Object.assign({}, goal(pid, drillId));
    g[field] = field === "days" ? Math.max(0, Math.min(7, Math.round(v))) : Math.max(0, Math.min(9999, Math.round(v)));
    if (!state.goals[pid]) state.goals[pid] = {};
    state.goals[pid][drillId] = g; save(); render();
  }

  $("app").addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-act]"); if (!b || b.disabled) return;
    var act = b.dataset.act, p = player(), k = keyOf(viewDate);
    if (act === "pick") { state.ui.active = b.dataset.id; save(); render(); }
    else if (act === "go") go(b.dataset.tab);
    else if (act === "day") { var nd = addDays(viewDate, +b.dataset.n); if (nd <= today()) { viewDate = nd; render(); } }
    else if (act === "shot" && p) { var made = b.dataset.made === "1", sid = b.dataset.shot; mutate(k, p.id, function (e) { e.s[sid][1]++; if (made) e.s[sid][0]++; }); }
    else if (act === "unshot" && p) {
      var mk = b.dataset.made === "1", id2 = b.dataset.shot;
      mutate(k, p.id, function (e) { var s = e.s[id2]; if (mk && s[0] > 0) { s[0]--; s[1]--; } else if (!mk && s[1] > s[0]) s[1]--; });
    }
    else if (act === "add" && p) { var d = drillById(b.dataset.drill); setDrill(p, d, val(p.id, k, d.id) + (+b.dataset.n)); }
    else if (act === "full" && p) { var d2 = drillById(b.dataset.drill); setDrill(p, d2, Math.max(val(p.id, k, d2.id), goal(p.id, d2.id).target)); }
    else if (act === "range") { state.ui.range = b.dataset.id; save(); render(); }
    else if (act === "goal" && p) { setGoal(p.id, b.dataset.drill, b.dataset.field, goal(p.id, b.dataset.drill)[b.dataset.field] + (+b.dataset.n)); }
    else if (act === "copyGoals" && p) {
      var src = {}; DRILLS.forEach(function (d) { src[d.id] = Object.assign({}, goal(p.id, d.id)); });
      state.players.forEach(function (pl) { state.goals[pl.id] = JSON.parse(JSON.stringify(src)); });
      save(); render(); toast("Everyone now has " + p.name + "'s goals");
    }
    else if (act === "resetGoals" && p) { delete state.goals[p.id]; save(); render(); toast("Starting goals restored for " + p.name); }
    else if (act === "addBlank") { state.players.push({ id: newId(), name: "" }); save(); render(); var ins = document.querySelectorAll("[data-name]"); ins[ins.length - 1].focus(); }
    else if (act === "start") {
      var named = state.players.filter(function (x) { return x.name.trim(); });
      if (!named.length) { toast("Type at least one name"); document.querySelector("[data-name]").focus(); return; }
      state.players = named.map(function (x) { return { id: x.id, name: x.name.trim() }; });
      state.ui.active = state.players[0].id; state.setup = true; state.ui.tab = "today"; save(); render();
    }
    else if (act === "addPlayer") {
      var name = ($("newName").value || "").trim();
      if (!name) { toast("Type a name first"); $("newName").focus(); return; }
      var np = { id: newId(), name: name }; state.players.push(np); state.ui.active = np.id; save(); render(); toast(name + " added");
    }
    else if (act === "del") {
      var target = state.players.find(function (x) { return x.id === b.dataset.id; }); if (!target) return;
      ask("Remove " + target.name + " and everything logged for him? This can't be undone.", "Remove", function () {
        state.players = state.players.filter(function (x) { return x.id !== target.id; });
        Object.keys(state.days).forEach(function (d) { delete state.days[d][target.id]; });
        delete state.goals[target.id]; undoStack = [];
        if (state.ui.active === target.id) state.ui.active = state.players[0] ? state.players[0].id : null;
        save(); render(); toast(target.name + " removed");
      });
    }
    else if (act === "backup") {
      var text = JSON.stringify({ players: state.players, days: state.days, goals: state.goals });
      $("restoreText").value = text;
      try { navigator.clipboard.writeText(text).then(function () { toast("Backup copied"); }, function () { toast("Select the text in the box and copy it"); }); }
      catch (e) { toast("Select the text in the box and copy it"); }
    }
    else if (act === "restore") {
      var parsed = null;
      try { parsed = JSON.parse($("restoreText").value); } catch (e) {}
      if (!valid(parsed) || !parsed.players.length || !parsed.players.every(function (x) { return x && typeof x.id === "string" && typeof x.name === "string"; })) { toast("That text isn't a backup from this app"); return; }
      ask("Replace everything on this phone with the pasted backup?", "Restore", function () {
        state.players = parsed.players.slice(0, MAX_PLAYERS).map(function (x) { return { id: x.id, name: x.name.slice(0, 16) }; });
        state.days = parsed.days; state.goals = parsed.goals && typeof parsed.goals === "object" ? parsed.goals : {}; undoStack = [];
        state.ui.active = state.players[0].id; save(); render(); toast("Backup restored");
      });
    }
    else if (act === "wipe") {
      ask("Erase every logged shot and workout? Names and goals stay. This can't be undone.", "Erase", function () { state.days = {}; undoStack = []; save(); render(); toast("All logs erased"); });
    }
  });

  $("app").addEventListener("change", function (ev) {
    var el = ev.target, p = player();
    if (el.id === "metricSel") { state.ui.metric = el.value; save(); render(); }
    else if (el.dataset.drill && p) { setDrill(p, drillById(el.dataset.drill), +el.value || 0); render(); }
    else if (el.dataset.goal && p) setGoal(p.id, el.dataset.goal, el.dataset.field, +el.value || 0);
  });
  $("app").addEventListener("focusin", function (ev) { if (ev.target.type === "number") ev.target.select(); });
  $("app").addEventListener("input", function (ev) {
    var el = ev.target;
    if (el.dataset.name) {
      var pl = state.players.find(function (x) { return x.id === el.dataset.name; });
      if (pl) { pl.name = state.setup ? (el.value.trim() || "Player") : el.value; save(); }
    }
  });
  $("app").addEventListener("keydown", function (ev) {
    if (ev.key !== "Enter") return;
    if (ev.target.id === "newName") { var b = document.querySelector('[data-act="addPlayer"]'); if (b) b.click(); }
    else if (ev.target.type === "number" || ev.target.dataset.name) ev.target.blur();
  });
  var rz; window.addEventListener("resize", function () { clearTimeout(rz); rz = setTimeout(function () { if (state.setup && state.ui.tab === "progress") drawChart(); }, 150); });

  render();
})();
</script>
</body>
</html>
